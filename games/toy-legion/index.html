<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9d68f">
  <title>玩具军团 Toy Legion</title>
  <meta name="description" content="把玩具兵沿着道路一路摆过去，强的能压住弱的。占满区域拿星星，或者直接冲进对方城堡。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="玩具军团 Toy Legion">
  <meta property="og:description" content="把玩具兵沿着道路一路摆过去，强的能压住弱的。占满区域拿星星，或者直接冲进对方城堡。">
  <meta property="og:url" content="%VITE_SITE_URL%toy-legion/">
  <meta property="og:image" content="%VITE_SITE_URL%covers/toy-legion.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.ico">
  <script>
    var gaId = "%VITE_GA_ID%";
    if (gaId && location.href.indexOf("%VITE_SITE_URL%") === 0) {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", gaId);
      var ga = document.createElement("script");
      ga.async = true;
      ga.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
      document.head.appendChild(ga);
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="gl" data-i18n-label="board"></canvas>

    <div class="hud-top" id="hud-top">
      <div class="chip" id="opp-chip">
        <span class="sq" id="opp-sq"></span>
        <span class="backs" id="opp-backs"></span>
        <span class="count" id="opp-count">5</span>
      </div>
      <div class="chip"><span class="medal">★ <b id="opp-medals">0</b><small id="opp-goal"> / 6</small></span></div>
    </div>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
      <button class="btn-small" id="banner-skip" data-i18n="skip" hidden></button>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="hud-bot" id="hud-bot">
      <div class="tray">
        <div class="hand-row">
          <div class="hand" id="hand"></div>
          <div class="draw-col">
            <button class="draw" id="draw"><span data-i18n="draw.pre"></span><b>2</b><span data-i18n="draw.post"></span></button>
            <small class="deck" id="deck"></small>
          </div>
        </div>
      </div>
    </div>

    <div class="overlay" id="pass" hidden>
      <div class="panel">
        <div class="panel-kicker" data-i18n="mode.local"></div>
        <h1 id="pass-title"></h1>
        <p id="pass-note"></p>
        <button class="btn-big" id="pass-go" data-i18n="pass.go"></button>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="panel">
        <div class="crown" aria-hidden="true">♛</div>
        <h1 id="over-title"></h1>
        <p id="over-note"></p>
        <div class="score"><span class="sq red"></span> <b id="over-red">0</b> : <b id="over-blue">0</b> <span class="sq blue"></span></div>
        <button class="btn-big" id="over-again" data-i18n="over.again"></button>
        <button class="btn-ghost wide" id="over-lobby" data-i18n="over.lobby"></button>
      </div>
    </div>

    <div class="tip" id="tip" hidden>
      <p id="tip-text"></p>
      <div class="tip-actions">
        <button class="tip-off" id="tip-off" data-i18n="tip.off"></button>
        <button class="btn-small" id="tip-ok" data-i18n="tip.ok"></button>
      </div>
    </div>

    <div class="card-tip" id="card-tip" hidden><b id="card-tip-name"></b><span id="card-tip-effect"></span></div>

    <div class="ghost" id="ghost" hidden></div>

    <div class="lobby-art" id="lobby-art" aria-hidden="true">
      <img class="blur" id="lobby-art-blur" alt="">
      <img class="main" id="lobby-art-main" alt="">
    </div>

    <div class="lobby" id="lobby">
      <div class="logo">
        <h1 data-i18n="title">玩具军团</h1>
      </div>
      <div class="lobby-actions">
        <button class="btn-big" id="lobby-start" data-i18n="lobby.start"></button>
        <div class="lobby-row">
          <button class="btn-pill" id="lobby-rules" data-i18n="lobby.rules"></button>
          <button class="btn-pill" id="lobby-units" data-i18n="lobby.units"></button>
        </div>
      </div>
      <button class="gear" id="lobby-settings" data-i18n-label="lobby.settings">⚙</button>
    </div>

    <div class="sheet" id="setup" hidden>
      <div class="sheet-body">
        <h2 data-i18n="setup.mode"></h2>
        <div class="modes">
          <button class="mode" data-mode="ai"><b data-i18n="mode.ai"></b><span data-i18n="mode.ai.note"></span></button>
          <button class="mode" data-mode="local"><b data-i18n="mode.local"></b><span data-i18n="mode.local.note"></span></button>
        </div>
        <div class="diff" id="diff">
          <span data-i18n="setup.diff"></span>
          <button data-diff="easy" data-i18n="diff.easy"></button>
          <button data-diff="normal" data-i18n="diff.normal"></button>
        </div>
        <h2 data-i18n="setup.map"></h2>
        <div class="maps" id="maps"></div>
        <div class="sheet-actions">
          <button class="btn-ghost" id="setup-back" data-i18n="setup.back"></button>
          <button class="btn-big" id="setup-go" data-i18n="setup.go"></button>
        </div>
      </div>
    </div>

    <div class="sheet" id="rules" hidden>
      <div class="sheet-body">
        <h2 data-i18n="lobby.rules"></h2>
        <ol class="steps">
          <li><b data-i18n="rules.1.h"></b><span data-i18n="rules.1"></span></li>
          <li><b data-i18n="rules.2.h"></b><span data-i18n="rules.2"></span></li>
          <li><b data-i18n="rules.3.h"></b><span data-i18n="rules.3"></span></li>
          <li><b data-i18n="rules.4.h"></b><span data-i18n="rules.4"></span></li>
        </ol>
        <div class="sheet-actions"><button class="btn-big" data-close data-i18n="rules.ok"></button></div>
      </div>
    </div>

    <div class="sheet" id="units" hidden>
      <div class="sheet-body">
        <h2 data-i18n="lobby.units"></h2>
        <div class="unit-list" id="unit-list"></div>
        <div class="sheet-actions"><button class="btn-big" data-close data-i18n="close"></button></div>
      </div>
    </div>

    <div class="sheet" id="settings" hidden>
      <div class="sheet-body">
        <h2 data-i18n="lobby.settings"></h2>
        <div class="setting"><span data-i18n="settings.lang"></span><div class="langs" id="langs"></div></div>
        <label class="setting"><span data-i18n="settings.tips"></span><input type="checkbox" id="opt-tips"></label>
        <label class="setting"><span data-i18n="settings.sound"></span><input type="checkbox" id="opt-sound" checked disabled></label>
        <div class="sheet-actions"><button class="btn-big" data-close data-i18n="close"></button></div>
      </div>
    </div>

    <div class="loader" id="loader">
      <img class="loader-art" id="loader-art" alt="">
      <div class="loader-troops" id="loader-troops"></div>
      <div class="loader-bar"><i id="loader-fill"></i></div>
      <p class="loader-text" data-i18n="loading"></p>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
