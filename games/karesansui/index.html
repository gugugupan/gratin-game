<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>枯山水 Karesansui</title>
    <meta name="description" content="拖着耙子一笔耙完枯山水。转弯只扫过一个扇形，没扫到的角落会一直乱着。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="枯山水 Karesansui" />
    <meta property="og:description" content="拖着耙子一笔耙完枯山水。转弯只扫过一个扇形，没扫到的角落会一直乱着。" />
    <meta property="og:url" content="%VITE_SITE_URL%karesansui/" />
    <meta property="og:image" content="%VITE_SITE_URL%covers/karesansui.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../favicon.ico" />
    <script>
      var gaId = "%VITE_GA_ID%";
      if (gaId && location.href.indexOf("%VITE_SITE_URL%") === 0) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", gaId);
        var ga = document.createElement("script");
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
        document.head.appendChild(ga);
      }
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="veil"></div>
    <div id="loading" data-i18n="loading">…</div>

    <section id="menu" class="overlay hidden">
      <h1 class="logo"><img src="./title.svg" alt="" /><span class="sr-only" data-i18n="logo">枯山水</span></h1>
      <div id="menu-modes" class="plaques">
        <button class="plaque" data-mode="puzzle"><span data-i18n="mode.puzzle"></span></button>
        <button class="plaque" data-mode="random"><span data-i18n="mode.random"></span></button>
        <button class="plaque" data-mode="free"><span data-i18n="mode.free"></span></button>
      </div>
      <div id="menu-sub" class="plaques small hidden"></div>
      <button id="menu-back" class="tag back hidden"><span class="face" data-i18n="back"></span></button>
      <div class="lang"><button data-lang="ja">日本語</button><button data-lang="zh">中文</button></div>
    </section>

    <section id="hud" class="hidden">
      <div id="side-card">
        <div class="side-head">
          <span id="hud-name"></span>
          <b id="hud-steps" data-i18n-title="hud.steps">0</b>
        </div>
        <canvas id="target-card" class="hidden" data-i18n-title="hud.target"></canvas>
        <div class="side-stats">
          <span><i data-i18n="hud.clean"></i> <b id="hud-clean">0%</b></span>
          <span id="hud-match-wrap"><i data-i18n="hud.match"></i> <b id="hud-match">0%</b></span>
        </div>
        <div id="hud-msg" class="msg"></div>
        <div id="hud-tip" class="tip"></div>
        <div class="side-buttons">
          <button class="plank" id="btn-undo" data-i18n="btn.undo" data-i18n-title="btn.undo.title"></button>
          <button class="plank" id="btn-reset" data-i18n="btn.reset" data-i18n-title="btn.reset.title"></button>
          <button class="plank" id="btn-hint" data-i18n="btn.hint" data-i18n-title="btn.hint.title"></button>
          <button class="plank shu" id="btn-finish" data-i18n="btn.finish" data-i18n-title="btn.finish.title"></button>
          <button class="plank" id="btn-menu" data-i18n="btn.menu" data-i18n-title="btn.menu.title"></button>
        </div>
      </div>
    </section>

    <section id="result" class="hidden">
      <div class="result-card">
        <div id="res-title" class="res-title">庭成</div>
        <div id="res-lines" class="res-lines"></div>
        <div class="chips">
          <button id="res-next">下一关</button>
          <button id="res-again" data-i18n="res.again"></button>
          <button id="res-menu" data-i18n="res.menu"></button>
        </div>
      </div>
    </section>

    <div id="spotlight" class="hidden"></div>
    <section id="tutorial" class="hidden">
      <div class="tut-card">
        <p id="tut-text"></p>
        <div class="tut-foot">
          <span id="tut-dots"></span>
          <button id="tut-skip" data-i18n="tut.skip"></button>
          <button id="tut-next">下一步</button>
        </div>
      </div>
    </section>

    <div id="skip" class="hidden" data-i18n="intro.skip"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
