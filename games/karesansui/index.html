<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>砂纹 Samon</title>
    <meta name="description" content="拖着耙子一笔耙完枯山水。转弯只扫过一个扇形，没扫到的角落会一直乱着。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="砂纹 Samon" />
    <meta property="og:description" content="拖着耙子一笔耙完枯山水。转弯只扫过一个扇形，没扫到的角落会一直乱着。" />
    <meta property="og:url" content="%VITE_SITE_URL%karesansui/" />
    <meta property="og:image" content="%VITE_SITE_URL%covers/karesansui.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../favicon.ico" />
    <script>
      var gaId = "%VITE_GA_ID%";
      if (gaId && location.href.indexOf("%VITE_SITE_URL%") === 0) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", gaId);
        var ga = document.createElement("script");
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
        document.head.appendChild(ga);
      }
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <section id="menu" class="overlay">
      <h1 class="logo">砂纹</h1>
      <div id="menu-modes" class="plaques">
        <button class="plaque" data-mode="puzzle"><span>庭题</span></button>
        <button class="plaque" data-mode="random"><span>随庭</span></button>
        <button class="plaque" data-mode="free"><span>自由</span></button>
      </div>
      <div id="menu-sub" class="plaques small hidden"></div>
      <button id="menu-back" class="tag back hidden"><span class="face">返回</span></button>
    </section>

    <section id="hud" class="hidden">
      <div class="hud-top">
        <div class="panel info">
          <div id="hud-name" class="name"></div>
          <div class="stats">
            <span>耙程 <b id="hud-steps">0</b></span>
            <span>整齐度 <b id="hud-clean">0%</b></span>
            <span id="hud-match-wrap">吻合度 <b id="hud-match">0%</b></span>
          </div>
          <div id="hud-msg" class="msg"></div>
        </div>
        <canvas id="target-card" class="hidden" title="按住在庭院里查看目标纹样"></canvas>
      </div>
      <div class="hud-bottom">
        <div class="rail"></div>
        <div class="tags">
          <button class="tag" id="btn-undo" title="撤销（Backspace / Z）"><span class="face">撤销</span></button>
          <button class="tag" id="btn-reset" title="重新开始"><span class="face">重来</span></button>
          <button class="tag" id="btn-finish" title="完成这幅画"><span class="face">完成</span></button>
          <button class="tag" id="btn-menu" title="回到菜单"><span class="face">菜单</span></button>
        </div>
      </div>
    </section>

    <section id="result" class="hidden">
      <div class="result-card">
        <div id="res-title" class="res-title">庭成</div>
        <div id="res-stars" class="stars"></div>
        <div id="res-lines" class="res-lines"></div>
        <div class="chips">
          <button id="res-next">下一关</button>
          <button id="res-again">再来一次</button>
          <button id="res-menu">菜单</button>
        </div>
      </div>
    </section>

    <div id="spotlight" class="hidden"></div>
    <section id="tutorial" class="hidden">
      <div class="tut-card">
        <p id="tut-text"></p>
        <div class="tut-foot">
          <span id="tut-dots"></span>
          <button id="tut-skip">跳过</button>
          <button id="tut-next">下一步</button>
        </div>
      </div>
    </section>

    <div id="skip" class="hidden">点击跳过</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
