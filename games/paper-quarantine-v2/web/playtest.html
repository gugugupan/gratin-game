<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸上防疫 v2 试玩（原型）</title>
  <style>
    :root { --ink: #2e2116; --soft: #6b5743; --paper: #f3ead8; --edge: #d8c8a8; --red: #c4472f; --blue: #2f6d8c; --gold: #c9951a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 "PingFang SC", "Hiragino Sans GB", sans-serif; color: var(--ink); background: #e9dfcb; display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
    #map { width: 100%; height: 100vh; display: block; background: #d9c6a3; }
    aside { overflow-y: auto; padding: 12px 14px 40px; background: var(--paper); border-left: 1px solid var(--edge); }
    h1 { font-size: 16px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: var(--soft); letter-spacing: .08em; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill { padding: 2px 8px; border-radius: 99px; background: #fff8ea; border: 1px solid var(--edge); }
    .pill.bad { background: var(--red); color: #fff; border-color: var(--red); }
    .news { padding: 6px 8px; background: #fff8ea; border-left: 4px solid var(--ink); margin: 4px 0; }
    .news small { color: var(--soft); display: block; }
    button { font: inherit; cursor: pointer; border: 1px solid #b9a988; background: #fffaf0; padding: 4px 8px; border-radius: 3px; }
    button:hover { background: #fff; border-color: var(--ink); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--red); color: #fff; border-color: var(--red); }
    .acts { display: grid; gap: 4px; }
    .acts button { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
    .acts button i { font-style: normal; color: var(--soft); font-size: 12px; }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .log { font-size: 12px; color: var(--soft); max-height: 220px; overflow-y: auto; background: #fff8ea; padding: 6px 8px; border: 1px solid var(--edge); }
    .log b { color: var(--ink); }
    .help { font-size: 12px; color: var(--soft); }
    select { font: inherit; }
    .over { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(30, 20, 10, .5); }
    .over div { background: var(--paper); padding: 20px 28px; border-radius: 6px; text-align: center; }
    #tip { position: fixed; pointer-events: none; background: #fffaf0; border: 1px solid var(--ink); padding: 6px 8px; font-size: 12px; display: none; max-width: 240px; }
  </style>
</head>
<body>
  <svg id="map" viewBox="-24 -20 48 40"></svg>
  <aside id="panel"></aside>
  <div id="tip"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
