name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build:all
        env:
          VITE_SITE_URL: ${{ vars.CF_SITE_URL }}
          VITE_GA_ID: G-8J5VSLTX1B
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Build Paper Quarantine v2 preview (optional, never blocks the site)
        continue-on-error: true
        run: |
          npm ci --prefix games/paper-quarantine-v2
          npm test --prefix games/paper-quarantine-v2
          npm run build --prefix games/paper-quarantine-v2
          rm -rf dist/paper-quarantine-v2
          cp -R games/paper-quarantine-v2/dist-web dist/paper-quarantine-v2
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=gratin-game --branch=${{ github.ref_name }}
