<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="焼きたての HTML ゲーム、そろってます。Fresh-baked HTML games, all in one dish.">
  <meta name="theme-color" content="#FFF1D6">
  <link rel="icon" href="./favicon.ico" sizes="48x48">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="グラタンゲーム">
  <meta property="og:description" content="焼きたての HTML ゲーム、そろってます。">
  <meta property="og:image" content="%VITE_SITE_URL%og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    var gaId = "%VITE_GA_ID%";
    if (gaId && location.href.indexOf("%VITE_SITE_URL%") === 0) {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", gaId);
      var ga = document.createElement("script");
      ga.async = true;
      ga.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
      document.head.appendChild(ga);

<body>
  <div class="drip" aria-hidden="true"></div>
  <header class="top">
    <h1 class="brand"><img src="./wordmark.svg" alt="グラタンゲーム" width="1344" height="240"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="lang" role="group" data-i18n-label="language"></div>
  </header>
  <main>
    <p class="count"></p>
    <ul class="grid"></ul>
  </main>
  <section class="feedback" aria-labelledby="feedback-title">
    <h2 id="feedback-title" data-i18n="feedbackTitle"></h2>
    <p data-i18n="feedbackBody"></p>
    <form class="fb-form" novalidate>
      <textarea id="fb-message" class="fb-input" rows="4" maxlength="3000" data-i18n-placeholder="feedbackPlaceholder" data-i18n-label="feedbackPlaceholder"></textarea>
      <input id="fb-email" class="fb-input" type="email" autocomplete="email" data-i18n-placeholder="feedbackEmail" data-i18n-label="feedbackEmail">
      <label class="fb-bot" aria-hidden="true"><input id="fb-bot" type="checkbox" tabindex="-1"></label>
      <div class="feedback-actions">
        <button type="submit" class="mail fb-send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg><span data-i18n="feedbackSend"></span></button>
        <span class="fb-status" role="status" aria-live="polite"></span>
        <a class="fb-fallback" href="#" hidden data-i18n="feedbackByMail"></a>
      </div>
      <p class="fb-alt"><span data-i18n="feedbackOr"></span> <a class="mail-address" href="#"></a></p>
    </form>
  </section>
  <footer class="foot">
    <img src="./icon.svg" alt="" width="40" height="40">
    <p><span data-i18n="footer"></span><br>© 2026 グラタンゲーム · <a class="privacy-link" href="./privacy/"></a></p>
  </footer>
  <script type="module" src="./src/main.ts"></script>

</html>
